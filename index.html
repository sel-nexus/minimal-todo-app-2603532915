<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A deterministic, standalone todo test fixture.">
  <meta name="theme-color" content="#355e53">
  <title>Todo App</title>
  <style>
    :root {
      --background: #f7f7f3;
      --surface: #ffffff;
      --foreground: #1d2421;
      --muted: #66706b;
      --border: #d9dfda;
      --accent: #355e53;
      --accent-hover: #27483f;
      --danger: #9b3d35;
      --danger-hover: #7d302a;
      --ring: #6d9a8c;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      line-height: 1.5;
    }

    main {
      width: min(100% - 32px, 640px);
      margin: 0 auto;
      padding: 72px 0;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 6vw, 3.25rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.08;
    }

    .intro {
      max-width: 54ch;
      margin: 16px 0 36px;
      color: var(--muted);
    }

    .todo-panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .task-form {
      display: flex;
      gap: 12px;
    }

    input[type="text"] {
      min-width: 0;
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--foreground);
      font: inherit;
      padding: 10px 12px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 10px 14px;
    }

    #add-button {
      background: var(--accent);
      color: #ffffff;
    }

    #add-button:hover { background: var(--accent-hover); }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 2px;
    }

    #empty-state {
      margin: 28px 0 4px;
      color: var(--muted);
      text-align: center;
    }

    #todo-list {
      margin: 20px 0 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--border);
      padding: 14px 0;
    }

    .todo-item:first-child { border-top: 0; }

    .todo-title { overflow-wrap: anywhere; }
    .todo-title.is-completed { color: var(--muted); text-decoration: line-through; }

    .delete-button {
      border-color: var(--border);
      background: transparent;
      color: var(--danger);
      padding: 7px 10px;
    }

    .delete-button:hover { border-color: var(--danger); background: #fff7f6; color: var(--danger-hover); }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Browser test fixture</p>
    <h1>Todo App</h1>
    <p class="intro">Add a task, mark it complete, or remove it. All state is intentionally temporary.</p>

    <section class="todo-panel" aria-labelledby="todo-form-label">
      <form id="todo-form">
        <label id="todo-form-label" for="todo-input">New task</label>
        <div class="task-form">
          <input id="todo-input" data-testid="todo-input" type="text" autocomplete="off" placeholder="e.g. Buy milk">
          <button id="add-button" data-testid="add-button" type="submit">Add</button>
        </div>
      </form>
      <p id="empty-state" data-testid="empty-state">No tasks yet.</p>
      <ul id="todo-list" data-testid="todo-list" aria-label="Tasks"></ul>
    </section>
  </main>

  <script>
    /** Maintain transient task state for the current page session. */
    const tasks = [];
    let nextId = 1;

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const emptyState = document.getElementById("empty-state");

    /** Render the entire task list and synchronize the empty-state visibility. */
    function renderTasks() {
      list.replaceChildren();
      emptyState.style.display = tasks.length === 0 ? "block" : "none";

      tasks.forEach((task) => {
        const item = document.createElement("li");
        item.className = "todo-item";
        item.dataset.testid = `todo-item-${task.id}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.dataset.testid = `todo-checkbox-${task.id}`;
        checkbox.setAttribute("aria-label", `Mark ${task.title} complete`);
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const title = document.createElement("span");
        title.className = `todo-title${task.completed ? " is-completed" : ""}`;
        title.dataset.testid = `todo-title-${task.id}`;
        title.textContent = task.title;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.dataset.testid = `todo-delete-${task.id}`;
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteTask(task.id));

        item.append(checkbox, title, deleteButton);
        list.append(item);
      });
    }

    /** Add a non-empty, trimmed task from the text input. */
    function addTask() {
      const title = input.value.trim();
      if (title === "") return;

      tasks.push({ id: nextId, title, completed: false });
      nextId += 1;
      input.value = "";
      renderTasks();
    }

    /** Flip completion state for exactly one matching task. */
    function toggleTask(id) {
      const task = tasks.find((candidate) => candidate.id === id);
      if (!task) return;
      task.completed = !task.completed;
      renderTasks();
    }

    /** Remove exactly one matching task from the transient collection. */
    function deleteTask(id) {
      const index = tasks.findIndex((task) => task.id === id);
      if (index === -1) return;
      tasks.splice(index, 1);
      renderTasks();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      addTask();
    });

    renderTasks();
  </script>
</body>
</html>
